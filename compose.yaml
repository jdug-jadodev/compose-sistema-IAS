name: creditos-local

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}

      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8 --auth-host=scram-sha-256"
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256

    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - log_timezone=UTC

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

      - type: bind
        source: ./db/init
        target: /docker-entrypoint-initdb.d
        read_only: true
        bind:
          create_host_path: false

      - type: bind
        source: ./db/checks
        target: /opt/creditos-checks
        read_only: true
        bind:
          create_host_path: false

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD="$${APP_DB_PASSWORD}" PGCONNECT_TIMEOUT=2
          psql --host=127.0.0.1
          --username="$${APP_DB_USER}"
          --dbname="$${POSTGRES_DB}"
          --no-password
          --set=ON_ERROR_STOP=1
          --tuples-only
          --no-align
          --command='SELECT customer_id FROM public.customers LIMIT 0; SELECT application_reference FROM public.credit_applications LIMIT 0;'
          > /dev/null

      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

    shm_size: 128mb
    stop_grace_period: 30s

volumes:
  postgres_data: