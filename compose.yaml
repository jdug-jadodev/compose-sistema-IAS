name: creditos-local

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}

      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8 --auth-host=scram-sha-256"
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256

    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - log_timezone=UTC

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

      - type: bind
        source: ./db/init
        target: /docker-entrypoint-initdb.d
        read_only: true
        bind:
          create_host_path: false

      - type: bind
        source: ./db/checks
        target: /opt/creditos-checks
        read_only: true
        bind:
          create_host_path: false

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD="$${APP_DB_PASSWORD}" PGCONNECT_TIMEOUT=2
          psql --host=127.0.0.1
          --username="$${APP_DB_USER}"
          --dbname="$${POSTGRES_DB}"
          --no-password
          --set=ON_ERROR_STOP=1
          --tuples-only
          --no-align
          --command='SELECT customer_id FROM public.customers LIMIT 0; SELECT application_reference, idempotency_key FROM public.credit_applications LIMIT 0; SELECT last_value FROM public.credit_applications_reference_seq;'
          > /dev/null

      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

    shm_size: 128mb
    stop_grace_period: 30s

  backend:
    build:
      context: "https://github.com/jdug-jadodev/back-IAS.git#${BACKEND_REF:-main}"
    pull_policy: build
    restart: unless-stopped

    environment:
      DB_URL: r2dbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USER: ${APP_DB_USER}
      DB_PASSWORD: ${APP_DB_PASSWORD}
      SERVER_PORT: "8080"

    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"

    depends_on:
      postgres:
        condition: service_healthy
        restart: true

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 60s

    stop_grace_period: 30s

  frontend:
    build:
      context: "https://github.com/jdug-jadodev/front-IAS.git#${FRONTEND_REF:-main}"
    pull_policy: build
    restart: unless-stopped

    environment:
      BACKEND_URL: http://backend:8080
      NGINX_ENVSUBST_FILTER: BACKEND_URL

    ports:
      - "127.0.0.1:${FRONTEND_PORT:-4201}:80"

    depends_on:
      backend:
        condition: service_healthy
        restart: true

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null http://127.0.0.1/
          && wget -q -O /dev/null http://127.0.0.1/api/actuator/health
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:
